name: Run Size Limit Check

on:
  pull_request:
    branches:
      - develop

# If two pushes happen within a short time in the same PR, cancel the run of the oldest push
concurrency:
  group: pr-${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: starsling-ubuntu-22.04

    steps:
      - name: Benchmark event context (harness)
        shell: bash
        env:
          BENCH_PARENT: ${{ github.event.workflow_run.id }}
          BENCH_JOB: ${{ github.job }}
        run: printf "BENCH_PARENT_RUN_ID=%s\nBENCH_JOB_ID=%s\n" "$BENCH_PARENT" "$BENCH_JOB"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: pnpm
        run: pnpm install

      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: setup env
        run: |
          cp .env.example .env

      - name: Run asset compile
        run: bundle exec rake assets:precompile
        env:
          RAILS_ENV: production

      - name: Size Check
        run: pnpm run size
